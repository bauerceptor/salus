<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="logo-a-icon-title logo-a-icon-desc">
  <title id="logo-a-icon-title">Salus Icon - Connected Care Network</title>
  <desc id="logo-a-icon-desc">Tech-forward geometric icon with interconnected nodes for Salus</desc>

  <defs>
    <linearGradient id="tealGradAIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d7377"/>
      <stop offset="100%" style="stop-color:#14a3a8"/>
    </linearGradient>
    <linearGradient id="amberAccentIcon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Icon: Connected node network in square format -->
  <g transform="translate(8, 8)">
    <!-- Central node -->
    <circle cx="32" cy="32" r="10" fill="url(#tealGradAIcon)"/>
    <circle cx="32" cy="32" r="4" fill="#ffffff" opacity="0.9"/>

    <!-- Surrounding nodes -->
    <circle cx="32" cy="10" r="6" fill="url(#tealGradAIcon)"/>
    <line x1="32" y1="16" x2="32" y2="22" stroke="url(#tealGradAIcon)" stroke-width="2"/>

    <circle cx="54" cy="36" r="6" fill="url(#amberAccentIcon)"/>
    <line x1="48" y1="36" x2="42" y2="34" stroke="url(#amberAccentIcon)" stroke-width="2"/>

    <circle cx="28" cy="56" r="6" fill="#0d7377" opacity="0.8"/>
    <line x1="28" y1="50" x2="30" y2="42" stroke="#0d7377" stroke-width="2" opacity="0.8"/>

    <circle cx="8" cy="28" r="5" fill="#0d7377" opacity="0.7"/>
    <line x1="14" y1="28" x2="22" y2="30" stroke="#0d7377" stroke-width="2" opacity="0.7"/>

    <circle cx="14" cy="14" r="4" fill="url(#amberAccentIcon)"/>
    <line x1="18" y1="18" x2="24" y2="24" stroke="url(#amberAccentIcon)" stroke-width="1.5"/>
  </g>
</svg>