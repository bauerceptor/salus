<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdfa"/>
      <stop offset="100%" style="stop-color:#ccfbf1"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d7377;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0d7377;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d7377"/>
      <stop offset="100%" style="stop-color:#14919b"/>
    </linearGradient>
  </defs>
  <rect width="500" height="300" fill="url(#bgGrad)" rx="12"/>
  <rect x="40" y="40" width="420" height="220" rx="8" fill="#ffffff" opacity="0.9"/>
  <rect x="40" y="40" width="420" height="40" rx="8" fill="#0d7377"/>
  <rect x="40" y="72" width="420" height="8" fill="#0d7377"/>
  <circle cx="60" cy="60" r="12" fill="#ffffff" opacity="0.3"/>
  <circle cx="90" cy="60" r="12" fill="#ffffff" opacity="0.3"/>
  <circle cx="120" cy="60" r="12" fill="#ffffff" opacity="0.3"/>
  <g transform="translate(60, 110)">
    <text x="0" y="0" fill="#64748b" font-size="11" font-family="system-ui, sans-serif">Heart Rate</text>
    <text x="0" y="20" fill="#0d7377" font-size="24" font-weight="700" font-family="system-ui, sans-serif">72 bpm</text>
    <text x="85" y="20" fill="#10b981" font-size="12" font-family="system-ui, sans-serif">Normal</text>
  </g>
  <g transform="translate(200, 110)">
    <text x="0" y="0" fill="#64748b" font-size="11" font-family="system-ui, sans-serif">Blood Pressure</text>
    <text x="0" y="20" fill="#8b5cf6" font-size="24" font-weight="700" font-family="system-ui, sans-serif">120/80</text>
    <text x="95" y="20" fill="#10b981" font-size="12" font-family="system-ui, sans-serif">Normal</text>
  </g>
  <g transform="translate(340, 110)">
    <text x="0" y="0" fill="#64748b" font-size="11" font-family="system-ui, sans-serif">SpO2</text>
    <text x="0" y="20" fill="#0ea5e9" font-size="24" font-weight="700" font-family="system-ui, sans-serif">98%</text>
    <text x="60" y="20" fill="#10b981" font-size="12" font-family="system-ui, sans-serif">Good</text>
  </g>
  <path d="M60,200 Q90,180 120,190 T180,170 T240,185 T300,160 T360,175 T420,155" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M60,200 Q90,180 120,190 T180,170 T240,185 T300,160 T360,175 T420,155 L420,230 L60,230 Z" fill="url(#chartGrad)"/>
  <g transform="translate(60, 230)">
    <circle cx="0" cy="0" r="4" fill="#0d7377"/>
    <circle cx="60" cy="-20" r="4" fill="#0d7377"/>
    <circle cx="120" cy="-10" r="4" fill="#0d7377"/>
    <circle cx="180" cy="-30" r="4" fill="#0d7377"/>
    <circle cx="240" cy="-15" r="4" fill="#0d7377"/>
    <circle cx="300" cy="-40" r="4" fill="#0d7377"/>
    <circle cx="360" cy="-25" r="4" fill="#0d7377"/>
  </g>
  <g transform="translate(430, 155)">
    <rect x="0" y="0" width="20" height="80" rx="4" fill="#10b981" opacity="0.2"/>
    <rect x="0" y="40" width="20" height="40" rx="4" fill="#10b981"/>
  </g>
