<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="salus-icon-title salus-icon-desc">
  <title id="salus-icon-title">Salus Icon</title>
  <desc id="salus-icon-desc">Connected Care Network icon for Salus</desc>

  <defs>
    <linearGradient id="tealGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d7377"/>
      <stop offset="100%" style="stop-color:#14a3a8"/>
    </linearGradient>
    <linearGradient id="amberAccentIcon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Icon: Connected Care Network -->
  <g transform="translate(4, 4)">
    <!-- Central node -->
    <circle cx="28" cy="28" r="9" fill="url(#tealGradIcon)"/>
    <circle cx="28" cy="28" r="3.5" fill="#ffffff" opacity="0.9"/>

    <!-- Surrounding nodes -->
    <!-- Top -->
    <circle cx="28" cy="8" r="5" fill="url(#tealGradIcon)"/>
    <line x1="28" y1="13" x2="28" y2="19" stroke="url(#tealGradIcon)" stroke-width="2"/>

    <!-- Top-right -->
    <circle cx="46" cy="14" r="4" fill="#0d7377" opacity="0.7"/>
    <line x1="42" y1="17" x2="35" y2="22" stroke="#0d7377" stroke-width="1.5" opacity="0.7"/>

    <!-- Right -->
    <circle cx="52" cy="30" r="5" fill="url(#amberAccentIcon)"/>
    <line x1="47" y1="30" x2="37" y2="29" stroke="url(#amberAccentIcon)" stroke-width="1.5"/>

    <!-- Bottom-right -->
    <circle cx="44" cy="48" r="4" fill="#0d7377" opacity="0.7"/>
    <line x1="41" y1="45" x2="35" y2="37" stroke="#0d7377" stroke-width="1.5" opacity="0.7"/>

    <!-- Bottom -->
    <circle cx="24" cy="50" r="5" fill="#0d7377" opacity="0.8"/>
    <line x1="24" y1="45" x2="26" y2="37" stroke="#0d7377" stroke-width="1.5" opacity="0.8"/>

    <!-- Left -->
    <circle cx="4" cy="26" r="4" fill="#0d7377" opacity="0.7"/>
    <line x1="9" y1="26" x2="19" y2="27" stroke="#0d7377" stroke-width="1.5" opacity="0.7"/>

    <!-- Top-left -->
    <circle cx="10" cy="12" r="3.5" fill="url(#amberAccentIcon)"/>
    <line x1="13" y1="15" x2="20" y2="21" stroke="url(#amberAccentIcon)" stroke-width="1.5"/>
  </g>
</svg>