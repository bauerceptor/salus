  help:
    index:
      title: Help Center
      intro:
        title: How can we help you?
        description: Find answers to common questions about using Salus
      sections:
        getting_started:
          title: Getting Started
          q1:
            question: How do I set up my profile?
            answer: After signing up, complete your profile by adding your personal information, emergency contacts, and any existing conditions. Go to Settings > Account Settings to update your profile.
          q2:
            question: How do I navigate the dashboard?
            answer: Your dashboard shows an overview of your health status. The sidebar contains links to all sections including Diseases, Medications, Measurements, and more. Use the search bar to quickly find specific items.
          q3:
            question: How do I connect with my care team?
            answer: You can connect with healthcare specialists through the Specialists section. Send a care request and once approved, you'll be able to receive recommendations and communicate with them.
        health_tracking:
          title: Health Tracking
          q1:
            question: How do I log a measurement?
            answer: Go to My Health > Measurements and click "New Measurement". Select the type (weight, blood pressure, heart rate, etc.) and enter your values. The data will be saved and can be viewed in charts.
          q2:
            question: How do I track my medications?
            answer: Navigate to Medications to add and manage your medications. Set up schedules for reminders and log when you take each dose to track adherence.
          q3:
            question: Can I export my health data?
            answer: Yes, you can export all your health data in FHIR format from the FHIR Export section on your dashboard. This includes measurements, diseases, medications, and treatments.
        care_team:
          title: Care Team
          q1:
            question: How do I add a caregiver?
            answer: Go to Caregivers in the sidebar and send a request to the person you'd like to add as your caregiver. They can view your health updates and receive alerts.
          q2:
            question: How do I communicate with my doctor?
            answer: If you've connected with a specialist, you can message them through the Messages section. You can also receive recommendations from your care team.
        privacy_security:
          title: Privacy & Security
          q1:
            question: Is my health data secure?
            answer: Yes, Salus uses industry-standard encryption to protect your data. Your health information is only shared with your explicit consent and connected care team members.
          q2:
            question: Who can see my health information?
            answer: Only you and the care team members you explicitly connect with can view your health data. You can control this through your privacy settings.
      contact:
        title: Still need help?
        description: Contact our support team and we'll get back to you as soon as possible.
